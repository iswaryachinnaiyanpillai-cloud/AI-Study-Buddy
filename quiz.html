<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Zone</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<section class="page-container">


    <div class="logo">
        🧠
    </div>


    <h1>Quiz Zone</h1>


    <p>
        Test your knowledge and improve your learning skills
        with interactive quizzes.
    </p>



    <div class="quiz-box">

        <h2>Which language is used for web development?</h2>


        <div class="option">
            <input type="radio" name="answer" value="wrong">
            Python
        </div>


        <div class="option">
            <input type="radio" name="answer" value="correct">
            HTML
        </div>


        <div class="option">
            <input type="radio" name="answer" value="wrong">
            Java
        </div>


        <button onclick="checkAnswer()">
            Submit Answer
        </button>


        <h3 id="score"></h3>


    </div>



    <button onclick="location.href='index.html'">
        ← Back to Home
    </button>


</section>



<script src="script.js"></script>


</body>

</html>
